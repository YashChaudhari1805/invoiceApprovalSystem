# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "invoiceapprovalsystem"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Disabled: this project seeds via a TypeScript script (scripts/seed.ts)
# that creates real Supabase Auth users through the Admin API -- that can't
# be expressed as a raw seed.sql file. Run `npm run seed` after `supabase
# start` instead (see README).
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = false
# Off, same as this project's documented note about disabling "Confirm
# email" on a real Supabase project for demo purposes -- local dev users
# (test seed users, self-registered accounts while developing) are usable
# immediately without needing local_smtp/Inbucket in the loop.
enable_confirmations = false

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
